# Directus für „Königsdorf rückt zusammen“ – läuft auf dem Hetzner-Server unter /opt/directus.
# Anleitung: hetzner/README.md. Werte (Passwörter, Domain) stehen in .env neben dieser Datei.

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "directus", "-d", "directus"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    # Version fest eintragen, Updates bewusst (siehe README „Updates“).
    image: directus/directus:12.5.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./data/uploads:/directus/uploads
      - ./data/extensions:/directus/extensions
    environment:
      PUBLIC_URL: https://${DIRECTUS_DOMAIN}
      SECRET: ${DIRECTUS_SECRET}

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${DB_PASSWORD}

      # Nur beim allerersten Start: legt den Admin-Account an.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Directus steht hinter Caddy: echte Besucher-IP für das Rate-Limit.
      IP_TRUST_PROXY: "true"
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_STORE: memory
      RATE_LIMITER_POINTS: 50
      RATE_LIMITER_DURATION: 1

      CACHE_ENABLED: "false"
      TELEMETRY: "false"

      # Lizenz (Open Innovation Grant), sobald vorhanden – siehe README.
      LICENSE_KEY: ${LICENSE_KEY:-}

      # Mails (Passwort vergessen, Einladungen) – später über Brevo-SMTP:
      # EMAIL_FROM: ${EMAIL_FROM}
      # EMAIL_TRANSPORT: smtp
      # EMAIL_SMTP_HOST: smtp-relay.brevo.com
      # EMAIL_SMTP_PORT: 587
      # EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      # EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}

  caddy:
    # Reverse-Proxy mit automatischem HTTPS (Let's Encrypt).
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - directus
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DIRECTUS_DOMAIN: ${DIRECTUS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
